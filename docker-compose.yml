# Postgres for `pnpm dev`. Tests use PGlite in memory and need none of this.
#   docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sands
      POSTGRES_PASSWORD: sands
      POSTGRES_DB: sands
    ports:
      - "5432:5432"
    volumes:
      - sands-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sands -d sands"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  sands-postgres:
